name: docs-presence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: required claim-cap files exist
        run: |
          test -f README.md
          test -f CLAIM_STATUS.md
          test -f GOVERNANCE.md
          grep -q RESEARCH CLAIM_STATUS.md
          grep -q UNSUPPORTED CLAIM_STATUS.md
